<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta de respostas • TAG SEPAT</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#173344;background:#edf3f4}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(100deg,#103b4d,#186374);color:white;padding:22px max(20px,calc((100vw - 1060px)/2))}main{max-width:1060px;margin:22px auto;padding:0 15px}.card{background:white;border:1px solid #d7e2e6;border-radius:16px;padding:22px;margin-bottom:15px;box-shadow:0 3px 15px #1733440b}h1{font-size:24px}h2{font-size:19px}.muted{color:#637b83}.badge{background:#e6f4f4;color:#126b72;padding:6px 9px;border-radius:8px;font-size:12px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.value{font-size:27px;font-weight:800}.btn{border:0;background:#117a80;color:white;border-radius:8px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.item{border-top:1px solid #e1ebec;padding-top:14px;margin-top:14px}.field{white-space:pre-wrap;overflow-wrap:anywhere}.label{color:#637b83;font-size:12px;font-weight:700}.warn{background:#fff5da;border-left:4px solid #dc9704;padding:12px;border-radius:7px}@media(max-width:650px){.grid{grid-template-columns:1fr}}@media print{header,.no-print{display:none}.card{box-shadow:none;border:0;break-inside:avoid}}</style></head><body><header><strong>TCERO · SGCE · CECEX-9</strong><div style="font-size:12px;color:#bedae2;margin-top:5px">TAG SEPAT • Consulta técnica restrita</div></header><main>
<section class="card"><div class="row"><div><h1>Respostas da entrevista • SEPAT</h1><p class="muted">Márcio Fábio Alves da Silva Júnior · Coordenador Técnico</p></div><span class="badge">Acesso de leitura</span></div><p>PCe 04328/2025 · TAG PCe 02469/2022 · Matriz de evidências V02</p><div class="row no-print"><span id="who">Validando autorização...</span><div><button class="btn" onclick="load()">Atualizar respostas</button> <button class="btn" onclick="window.print()">Imprimir / PDF</button> <button class="btn" onclick="exportar()">Exportar JSON</button></div></div><p id="status" role="status"></p></section>
<section class="grid" id="summary" style="margin-bottom:15px"></section><section id="responses"></section></main>
<script>
const API="https://zvtzbiqfwhggysiuiuxh.supabase.co/functions/v1/sepat-entrevista-api";
const TOKEN=decodeURIComponent(location.hash.slice(1).replace(/^acesso=/,""));
let record=null;
const esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){document.getElementById("status").textContent="Consultando dados da SEPAT...";document.getElementById("summary").innerHTML="";document.getElementById("responses").innerHTML="";
if(!TOKEN){document.getElementById("status").textContent="Utilize o link individual autorizado.";return}
try{const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:TOKEN,action:"load"})});const j=await res.json();if(!res.ok||j.perfil!=="auditor")throw Error(j.error||"Sem permissão de consulta");record=j;document.getElementById("who").textContent="Usuário autorizado: "+j.pessoa;
const answers=j.dados?.answers||{};let answered=Object.values(answers).filter(v=>v?.response?.trim()).length;
const blocks=[["Situação",j.estado||"Rascunho"],["Perguntas respondidas",answered+" / 33"],["Última atualização",j.ultima_edicao?new Date(j.ultima_edicao).toLocaleString("pt-BR"):"—"]];
document.getElementById("summary").innerHTML=blocks.map(b=>'<div class="card"><div class="label">'+esc(b[0])+'</div><div class="value" style="font-size:21px">'+esc(b[1])+'</div></div>').join("");
document.getElementById("responses").innerHTML='<section class="card"><h2>Identificação e dados gerais</h2><p>Entrevistador: '+esc(j.dados?.entrevistador)+' · Data: '+esc(j.dados?.dat)+' · Data-base: '+esc(j.dados?.base)+'</p><div class="warn">As situações relatadas exigem validação técnica e confronto com os documentos. Ausência de evidência não comprova automaticamente descumprimento.</div></section>'+Array.from({length:33},(_,i)=>{const id=i<23?'Q'+String(i+1).padStart(2,"0"):'PR'+(i-22);const a=answers[id]||{};return '<article class="card"><div class="row"><h2>'+esc(id)+'</h2><span class="badge">'+esc(a.status||"Sem classificação")+'</span></div><p class="label">Resposta</p><p class="field">'+esc(a.response||"Não respondida")+'</p><div class="item"><span class="label">Evidências</span><p class="field">'+esc(a.evidence||"—")+'</p><span class="label">Documento / SEI</span><p class="field">'+esc(a.sei||"—")+'</p><span class="label">Responsável e prazo</span><p>'+esc(a.responsible||"—")+' · '+esc(a.deadline||"—")+'</p><span class="label">Pendências</span><p class="field">'+esc(a.obstacle||"—")+'</p><span class="label">Providências</span><p class="field">'+esc(a.action||"—")+'</p></div></article>'}).join("");
document.getElementById("status").textContent="Respostas atualizadas. Acesso somente leitura.";
}catch(e){document.getElementById("status").textContent="Consulta bloqueada: "+e.message}}
function exportar(){if(!record)return;let blob=new Blob([JSON.stringify(record,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="respostas-tag-sepat-2026.json";a.click();URL.revokeObjectURL(url)}
load();
</script></body></html>
